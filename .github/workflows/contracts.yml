# The contract suites (contracts/README.md), and the moved code's own checks.
#   packages   the workspace (packages/): frozen install, every dependency in range, typecheck, and the vault's
#              and hub's own test suites, as their repos ran them
#   today      today's contracts against the pinned hub and vault (the reference for today's behaviour)
#   candidate  every suite against the core candidate this job builds from packages/ (build:core): the v0.8
#              bundle, packed and unpacked again, launched the way a user launches it, in a private network + PID
#              namespace; the run must report the hash the build produced (PLAN §7.2). The stock 0.7 build is
#              there too, as "the old programs".
#              The child-path build (--process-model child) runs compat/* until the Nov 3 decision deletes one path.
#   prism      Benjamin's compatibility suite, unchanged, against the same build (the Nov 9 gate, PLAN §3.1)
#   npm        the npm package (release/npm.ts) packed from the same build, installed with `npm i -g` and
#              `bun add -g`, and his suite on the npm install; keeps the linux-x64 tarball and the .tgz as artifacts
# The signed macOS bundle has its own workflow (bundle-macos.yml).
#   mutants    the contracts must catch each mutant, on the pinned vault and on rebuilt core candidates; each
#              flip must turn its red contracts green
# Everything is local to the runner: throwaway homes, random ports, no live service.
name: contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4"

jobs:
  packages:
    name: the moved code (workspace, typecheck, the vault's and hub's own tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: every dependency in range, and every version the moved repos locked kept (or a listed departure)
        run: bun scripts/check-dependency-tree.ts . packages/vault/bun.lock packages/hub/bun.lock
      - name: typecheck (cli, vault, hub)
        run: |
          bun run --cwd packages/cli typecheck
          bun run --cwd packages/vault typecheck
          bun run --cwd packages/hub typecheck
      - name: the cli's own tests
        run: bun test ./packages/cli
      - name: the release plan's own tests (what a merge may publish to npm, scripts/release-plan.ts)
        run: bun test ./scripts
      - name: the vault's own tests
        working-directory: packages/vault
        run: |
          bun test ./src/
          bun test ./core/src/
      - name: the hub's own tests
        working-directory: packages/hub
        run: bun test --timeout 30000 ./src

  today:
    name: today's contracts (+ v1 pending)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - &sandbox
        name: allow the sandbox (unprivileged user namespaces; nftables and lsof)
        working-directory: .
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables lsof iproute2 >/dev/null
      - &repos
        name: cache the pinned vault + hub checkouts
        uses: actions/cache@v4
        with:
          path: contracts/.cache/repos
          key: repos-${{ hashFiles('contracts/pins.json') }}-bun1.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: today's contracts (must pass)
        run: bun run today
      - name: v1 contracts (marked failing until built)
        run: bun run v1
      - name: harness self-tests (origin guard, cleanup, pinned checkouts, candidate adapter, sandbox)
        run: bun run selftest

  candidate:
    name: every suite on the candidate build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - *sandbox
      - *repos
      - run: bun install --frozen-lockfile
      - &build
        name: build the candidate (the v0.8 bundle, from packages/) and pack it
        id: build
        run: bun run build:core --out "$RUNNER_TEMP/build/candidate" --pack "$RUNNER_TEMP/dist"
      - &unpack
        name: unpack the tarball; the suites run on what it holds
        id: unpack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "${{ steps.build.outputs.tarball }}" -C "$RUNNER_TEMP/unpacked"
          echo "dir=$RUNNER_TEMP/unpacked/${{ steps.build.outputs.name }}" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/dist/SHA256SUMS"
      - &stock
        name: build the old programs (stock 0.7 from the pins, for takeover, identity and rollback)
        id: stock
        run: bun run build:stock
      - name: the contracts, against exactly that build
        env:
          CANDIDATE_DIR: ${{ steps.unpack.outputs.dir }}
          CANDIDATE_TARBALL: ${{ steps.build.outputs.tarball }}
          CANDIDATE_SHA256: ${{ steps.build.outputs.sha256 }}
          OLD_STOCK_SHA256: ${{ steps.stock.outputs.sha256 }}
        run: bun run candidate -- --v1 2>&1 | tee "$RUNNER_TEMP/candidate.log"; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: the run reported the hash this job built, before and after
        shell: bash
        run: |
          grep -qx "\[candidate\] sha256 ${{ steps.build.outputs.sha256 }}" "$RUNNER_TEMP/candidate.log"
          grep -q "^\[candidate\] unchanged after the run: sha256 ${{ steps.build.outputs.sha256 }}$" "$RUNNER_TEMP/candidate.log"
      - name: the child path (the hub's vault child, the fallback until the Nov 3 decision) still serves every client
        env:
          OLD_STOCK_SHA256: ${{ steps.stock.outputs.sha256 }}
        run: |
          bun run build:core --out "$RUNNER_TEMP/candidate-child" --process-model child --no-pack
          CANDIDATE_DIR="$RUNNER_TEMP/candidate-child" bun run candidate -- suites/compat

  prism:
    name: Benjamin's compatibility suite on the candidate build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - *sandbox
      - *repos
      - run: bun install --frozen-lockfile
      - *build
      - *unpack
      - *stock
      - name: his suite, unchanged (expected FAILs listed in prism-compat-expected.json until slice 1)
        env:
          CANDIDATE_DIR: ${{ steps.unpack.outputs.dir }}
          CANDIDATE_SHA256: ${{ steps.build.outputs.sha256 }}
          OLD_STOCK_SHA256: ${{ steps.stock.outputs.sha256 }}
        run: bun run prism-compat

  npm:
    name: the npm package, installed with npm and with bun, and Benjamin's suite on it
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          # npm 11.5+ (Node 24), the npm the release job publishes with (release.yml)
          node-version: '24'
      - *sandbox
      - *repos
      - run: bun install --frozen-lockfile
      - *build
      - name: pack @openparachute/core from that bundle (release/npm.ts)
        id: npm
        run: bun ../release/npm.ts --from "${{ steps.build.outputs.dir }}" --out "$RUNNER_TEMP/npm"
      - name: install it with npm and with bun (an old hub and vault planted beside it), then his suite on it
        env:
          CANDIDATE_DIR: ${{ steps.build.outputs.dir }}
          NPM_SCRATCH: ${{ runner.temp }}
        run: bun run npm-package -- --tgz "${{ steps.npm.outputs.tarball }}"
      - name: the npm package's sha256 (npm-SHA256SUMS, for the release and the first publish by hand)
        working-directory: ${{ runner.temp }}/npm
        run: sha256sum "$(basename "${{ steps.npm.outputs.tarball }}")" | tee npm-SHA256SUMS
      - name: keep the linux-x64 tarball, its SHA256SUMS and the npm package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            ${{ steps.build.outputs.tarball }}
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ steps.npm.outputs.tarball }}
            ${{ runner.temp }}/npm/npm-SHA256SUMS
          retention-days: 14

  mutants:
    name: mutants on the pinned vault (the contracts must catch each)
    runs-on: ubuntu-latest
    needs: [today]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - *sandbox
      - *repos
      - run: bun install --frozen-lockfile
      - name: on the pinned vault
        run: bun run mutants

  mutants-candidate:
    name: mutants and flips on rebuilt core candidates
    runs-on: ubuntu-latest
    needs: [candidate]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - *sandbox
      - *repos
      - run: bun install --frozen-lockfile
      - *stock
      - name: each mutant caught, each flip flipped
        env:
          OLD_STOCK_SHA256: ${{ steps.stock.outputs.sha256 }}
        run: bun run mutants:candidate
